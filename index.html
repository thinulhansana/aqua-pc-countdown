<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aqua PC Solutions — Launching November 21, 00:00:00</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="apple-touch-icon" href="assets/logo.jpg" />
  <meta name="description" content="Official launch countdown for Aqua PC Solutions — November 21 at 00:00:00." />
  <meta name="theme-color" content="#03060d" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Soft Ambient Backdrop -->
  <div class="ambient-bg" aria-hidden="true">
    <video id="bg-loop-video" class="bg-video" autoplay loop muted playsinline preload="auto" poster="assets/hero-rig.jpg">
      <source src="assets/aqua_pc_solutions_ad.mp4" type="video/mp4" />
      <source src="../marketing-video/aqua_pc_solutions_ad.mp4" type="video/mp4" />
    </video>
    <div class="ambient-scrim"></div>
  </div>

  <main class="viewport">
    <!-- Minimal Header -->
    <header class="minimal-header">
      <div class="brand">
        <img src="assets/logo.jpg" alt="Aqua PC Solutions" class="brand-logo" />
        <span class="brand-name">Aqua PC Solutions</span>
      </div>

      <div class="launch-tag">
        <span class="status-dot"></span>
        <span id="launch-label">NOVEMBER 21 · 00:00:00</span>
      </div>
    </header>

    <!-- Centerpiece: Looping Video Clip -->
    <section class="video-shell" aria-label="Official Launch Video">
      <video id="main-video" class="main-video" autoplay loop muted playsinline preload="auto" poster="assets/hero-rig.jpg">
        <source src="assets/aqua_pc_solutions_ad.mp4" type="video/mp4" />
        <source src="../marketing-video/aqua_pc_solutions_ad.mp4" type="video/mp4" />
      </video>

      <div class="video-actions">
        <button id="sound-toggle-btn" class="glass-btn" type="button" aria-label="Toggle sound">
          <span id="sound-icon" class="material-symbols-outlined">volume_off</span>
          <span id="sound-text">Sound Off</span>
        </button>
        <button id="fullscreen-btn" class="glass-btn glass-btn-icon" type="button" aria-label="Toggle fullscreen">
          <span class="material-symbols-outlined">fullscreen</span>
        </button>
      </div>
    </section>

    <!-- Minimal Sleek Countdown -->
    <section class="countdown-section" aria-label="Launch Countdown">
      <div class="countdown-grid" id="countdown-grid" aria-live="polite">
        <div class="time-unit">
          <span id="val-days" class="time-num">04</span>
          <span class="time-lbl">Days</span>
        </div>
        <span class="time-colon" aria-hidden="true">:</span>
        <div class="time-unit">
          <span id="val-hours" class="time-num">07</span>
          <span class="time-lbl">Hours</span>
        </div>
        <span class="time-colon" aria-hidden="true">:</span>
        <div class="time-unit">
          <span id="val-minutes" class="time-num">05</span>
          <span class="time-lbl">Minutes</span>
        </div>
        <span class="time-colon" aria-hidden="true">:</span>
        <div class="time-unit">
          <span id="val-seconds" class="time-num time-num-accent">00</span>
          <span class="time-lbl">Seconds</span>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
